name: CI & Agent Protocol Verification

on:
  pull_request:
    branches: [ main, develop ]
  push:
    branches: [ main, develop ]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Run Backend and Dashboard Tests
        run: |
          pytest tests/test_backend.py tests/test_infra_config.py tests/test_subscriber_ack.py tests/test_validator.py tests/test_web_accessibility.py

      - name: Security Check - Ensure No Secrets Committed
        run: |
          if git ls-files | grep -E "(\.env$|secrets\.h$)"; then
            echo "::error::Phát hiện file secret bị commit lên Git (.env hoặc secrets.h)! Vui lòng gỡ bỏ."
            exit 1
          fi
          echo "Không phát hiện secret nhạy cảm."
