services:
  # MQTT Broker (Eclipse Mosquitto) phuc vu trao doi ban tin giua TV2 va TV3
  mqtt-broker:
    image: eclipse-mosquitto:2.0
    container_name: iot_posture_mqtt
    restart: unless-stopped
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME:?Set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env}
    entrypoint: ["/bin/sh", "-c"]
    command: ["test \"$$MQTT_PASSWORD\" != change_me_mqtt || { echo 'Set a non-default MQTT_PASSWORD in .env' >&2; exit 1; }; test \"$${#MQTT_PASSWORD}\" -ge 12 || { echo 'MQTT_PASSWORD must be at least 12 characters' >&2; exit 1; }; mosquitto_passwd -b -c /mosquitto/data/password_file \"$$MQTT_USERNAME\" \"$$MQTT_PASSWORD\" && chown mosquitto:mosquitto /mosquitto/data/password_file && chmod 0600 /mosquitto/data/password_file && exec mosquitto -c /mosquitto/config/mosquitto.conf"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -u \"$$MQTT_USERNAME\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/version' -C 1 -W 5 >/dev/null"]
      interval: 10s
      timeout: 7s
      retries: 5
      start_period: 20s
    ports:
      - "127.0.0.1:1883:1883"   # Local development only
      - "127.0.0.1:9001:9001"   # Local development only
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      API_HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8000/api/events/latest', timeout=3); assert r.status == 200"]
      interval: 10s
      timeout: 5s
      retries: 5

  subscriber:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "backend.mqtt_subscriber"]
    restart: unless-stopped
    environment:
      MQTT_HOST: mqtt-broker
      MQTT_PORT: 1883
      MQTT_TOPIC: ${MQTT_TOPIC:-classroom/posture/events}
      MQTT_USERNAME: ${MQTT_USERNAME:?Set MQTT_USERNAME in .env}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?Set MQTT_PASSWORD in .env}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    depends_on:
      mqtt-broker:
        condition: service_healthy
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - posture_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?Set DB_USER in .env} -d ${DB_NAME:?Set DB_NAME in .env}"]
      interval: 5s
      timeout: 3s
      retries: 10

  dashboard:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      HOST: 0.0.0.0
      BACKEND_URL: http://api:8000
      WEB_PORT: 8080
    depends_on:
      api:
        condition: service_healthy

volumes:
  mosquitto_data:
  posture_pgdata:
